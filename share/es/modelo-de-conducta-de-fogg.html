<title>Modelo de conducta de Fogg — UX Guidelines</title>
<meta name="description" content="El modelo de BJ Fogg (2009) dice que una conducta ocurre solo cuando Motivación, Capacidad y Disparador coinciden. Quita cualquiera de los tres y la acción no sucede — aunque los otros dos estén al máximo. El modelo es la base del diseño de conducta, la tecnología persuasiva y el método Tiny Habits.">
