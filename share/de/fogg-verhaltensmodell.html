<title>Fogg-Verhaltensmodell — UX Guidelines</title>
<meta name="description" content="BJ Foggs Modell von 2009 besagt: Ein Verhalten tritt nur auf, wenn Motivation, Fähigkeit und ein Prompt (ursprünglich nannte er ihn Trigger) zusammentreffen. Fehlt eines, passiert die Handlung nicht — selbst wenn die anderen beiden maximal sind. Das Modell ist die Grundlage von Behavior Design, persuasiver Technologie und der Tiny-Habits-Methode.">
