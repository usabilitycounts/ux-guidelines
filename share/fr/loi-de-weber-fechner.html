<meta name="description" content="Ernst Weber (1834) et Gustav Fechner (1860) ont formalisé la relation entre stimulus physique et intensité perçue. Le plus petit changement détectable n&#x27;est pas une quantité fixe — c&#x27;est une proportion fixe de ce qui existe déjà. La loi apparaît dans le volume, la luminosité, les prix, le poids, le timing d&#x27;animation et le contraste.">
